<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ma Cave à Vin</title>

<!-- Optimisations iOS (mode Web App) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Cave">
<meta name="theme-color" content="#0b0b0f">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="">

<style>
  :root{
    --bg:#0b0b0f;
    --surface:#16161d;
    --surface2:#1f1f29;
    --line:#2a2a36;
    --text:#f4f4f7;
    --muted:#8e8e9c;
    --wine:#c0395a;
    --wine2:#8e2142;
    --ok:#34c759;
    --danger:#ff453a;
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);
    padding-bottom:calc(110px + var(--safe-bottom));
    -webkit-user-select:none;user-select:none}
  input{-webkit-user-select:text;user-select:text}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  header{padding:18px 0 6px}
  h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.5px}
  h1 span{color:var(--wine)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .stat{background:linear-gradient(145deg,var(--surface),var(--surface2));
    border:1px solid var(--line);border-radius:20px;padding:16px}
  .stat small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
  .stat b{display:block;font-size:28px;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat.accent b{color:var(--wine)}

  .search{position:sticky;top:var(--safe-top);z-index:5;padding:8px 0 12px;
    background:linear-gradient(var(--bg) 80%,transparent)}
  .search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:17px;padding:0 16px 0 46px;outline:none;
    -webkit-appearance:none;appearance:none}
  .search input:focus{border-color:var(--wine)}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);margin-top:-2px;
    width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}

  .list{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;
    animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .name{font-size:19px;font-weight:700;line-height:1.25;word-break:break-word}
  .meta{color:var(--muted);font-size:15px;margin-top:4px}
  .menu{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:none;background:var(--surface2);
    color:var(--text);display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{transform:scale(.92);background:var(--line)}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.del{color:var(--danger)}

  .qty{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  .qty .sub{color:var(--muted);font-size:14px}
  .qty .sub b{color:var(--text)}
  .stepper{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:18px;padding:5px}
  .step{width:58px;height:52px;border-radius:14px;border:none;font-size:30px;font-weight:600;
    color:var(--text);background:var(--line);cursor:pointer;line-height:1;touch-action:manipulation}
  .step.plus{background:var(--wine)}
  .step:active{transform:scale(.9)}
  .step:disabled{opacity:.35}
  .count{min-width:48px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .count.zero{color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.5}
  .empty .big{font-size:52px;margin-bottom:8px}

  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));height:60px;padding:0 24px;
    border:none;border-radius:30px;background:linear-gradient(135deg,var(--wine),var(--wine2));
    color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;
    box-shadow:0 10px 30px rgba(192,57,90,.45);cursor:pointer;z-index:10;touch-action:manipulation}
  .fab:active{transform:scale(.95)}
  .fab svg{width:22px;height:22px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}

  /* Feuille modale */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:28px 28px 0 0;
    padding:22px 18px calc(22px + var(--safe-bottom));border:1px solid var(--line);
    animation:up .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px}}
  .sheet h2{margin:0 0 16px;font-size:22px}
  label{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
  .sheet input{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface2);color:var(--text);font-size:17px;padding:0 14px;outline:none;
    -webkit-appearance:none;appearance:none}
  .sheet input:focus{border-color:var(--wine)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .actions{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:22px}
  .btn{height:56px;border-radius:16px;border:none;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .btn:active{transform:scale(.96)}
  .btn.cancel{background:var(--surface2);color:var(--text)}
  .btn.save{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff}
  .err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div class="wrap">
  <header><h1>🍷 Ma <span>Cave</span></h1></header>

  <section class="stats">
    <div class="stat"><small>Bouteilles</small><b id="totalBottles">0</b></div>
    <div class="stat accent"><small>Valeur totale</small><b id="totalValue">0 €</b></div>
  </section>

  <div class="search" style="position:sticky">
    <div style="position:relative">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un vin…" autocomplete="off" autocorrect="off" autocapitalize="none" enterkeyhint="search">
    </div>
  </div>

  <main class="list" id="list"></main>
</div>

<button class="fab" id="addBtn" aria-label="Ajouter une bouteille">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter
</button>

<div class="overlay" id="overlay">
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="sheetTitle">Nouvelle bouteille</h2>
    <label for="fName">Nom du vin</label>
    <input id="fName" type="text" placeholder="Ex. Château Margaux" autocapitalize="words" enterkeyhint="next">
    <div class="row">
      <div><label for="fYear">Millésime</label>
        <input id="fYear" type="number" inputmode="numeric" placeholder="2015" min="1800" max="2100"></div>
      <div><label for="fPrice">Prix (€)</label>
        <input id="fPrice" type="number" inputmode="decimal" placeholder="25" min="0" step="0.01"></div>
    </div>
    <label for="fQty">Quantité restante</label>
    <input id="fQty" type="number" inputmode="numeric" placeholder="6" min="0" step="1">
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="btn cancel" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn save">Enregistrer</button>
    </div>
  </form>
</div>

<script>
(function(){
  'use strict';
  var KEY = 'maCaveAVin.v1';
  var items = [];
  var editingId = null;

  var $ = function(id){ return document.getElementById(id); };
  var listEl=$('list'), qEl=$('q'), overlay=$('overlay'), form=$('form'), errEl=$('err');
  var fName=$('fName'), fYear=$('fYear'), fPrice=$('fPrice'), fQty=$('fQty');

  /* ---------- Stockage local ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(items)) items = [];
    }catch(e){ items = []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){}
  }

  /* ---------- Utilitaires ---------- */
  var eur = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

  /* ---------- Rendu ---------- */
  function render(){
    var term = qEl.value.trim().toLowerCase();
    var shown = items.filter(function(b){ return b.name.toLowerCase().indexOf(term) !== -1; })
      .sort(function(a,b){ return a.name.localeCompare(b.name,'fr'); });

    var totalB = 0, totalV = 0;
    items.forEach(function(b){ totalB += b.qty; totalV += b.qty * b.price; });
    $('totalBottles').textContent = totalB;
    $('totalValue').textContent = eur.format(totalV);

    if(!shown.length){
      listEl.innerHTML = '<div class="empty"><div class="big">🍾</div>' +
        (items.length ? 'Aucune bouteille ne correspond à votre recherche.'
                      : 'Votre cave est vide.<br>Touchez « Ajouter » pour commencer.') + '</div>';
      return;
    }

    listEl.innerHTML = shown.map(function(b){
      var year = b.year ? b.year : 'Sans millésime';
      return '<article class="card" data-id="'+b.id+'">' +
        '<div class="top"><div>' +
          '<div class="name">'+esc(b.name)+'</div>' +
          '<div class="meta">'+esc(year)+' · '+eur.format(b.price)+' / btl</div>' +
        '</div><div class="menu">' +
          '<button class="icon-btn" data-act="edit" aria-label="Modifier"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>' +
          '<button class="icon-btn del" data-act="del" aria-label="Supprimer"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>' +
        '</div></div>' +
        '<div class="qty"><div class="sub">Valeur <b>'+eur.format(b.qty*b.price)+'</b></div>' +
          '<div class="stepper">' +
            '<button class="step" data-act="minus" aria-label="Retirer une bouteille"'+(b.qty<=0?' disabled':'')+'>−</button>' +
            '<div class="count'+(b.qty<=0?' zero':'')+'">'+b.qty+'</div>' +
            '<button class="step plus" data-act="plus" aria-label="Ajouter une bouteille">+</button>' +
          '</div></div>' +
      '</article>';
    }).join('');
  }

  /* ---------- Actions sur la liste ---------- */
  listEl.addEventListener('click',function(e){
    var btn = e.target.closest('button[data-act]');
    if(!btn) return;
    var card = btn.closest('.card');
    var id = card.getAttribute('data-id');
    var b = items.find(function(x){ return x.id === id; });
    if(!b) return;
    var act = btn.getAttribute('data-act');

    if(act === 'plus'){ b.qty++; haptic(); save(); render(); }
    else if(act === 'minus'){ if(b.qty>0){ b.qty--; haptic(); save(); render(); } }
    else if(act === 'edit'){ openSheet(b); }
    else if(act === 'del'){
      if(confirm('Supprimer « '+b.name+' » de la cave ?')){
        items = items.filter(function(x){ return x.id !== id; });
        save(); render();
      }
    }
  });

  /* ---------- Feuille d'ajout / édition ---------- */
  function openSheet(b){
    editingId = b ? b.id : null;
    $('sheetTitle').textContent = b ? 'Modifier la bouteille' : 'Nouvelle bouteille';
    fName.value  = b ? b.name : '';
    fYear.value  = b && b.year ? b.year : '';
    fPrice.value = b ? b.price : '';
    fQty.value   = b ? b.qty : '1';
    errEl.textContent = '';
    overlay.classList.add('open');
    setTimeout(function(){ if(!b) fName.focus(); },300);
  }
  function closeSheet(){
    overlay.classList.remove('open');
    document.activeElement && document.activeElement.blur();
  }

  $('addBtn').addEventListener('click',function(){ openSheet(null); });
  $('cancelBtn').addEventListener('click',closeSheet);
  overlay.addEventListener('click',function(e){ if(e.target === overlay) closeSheet(); });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name = fName.value.trim();
    var year = fYear.value.trim() === '' ? null : parseInt(fYear.value,10);
    var price = fPrice.value.trim() === '' ? 0 : parseFloat(String(fPrice.value).replace(',','.'));
    var qty = fQty.value.trim() === '' ? 0 : parseInt(fQty.value,10);

    if(!name){ errEl.textContent = 'Le nom du vin est obligatoire.'; return; }
    if(isNaN(price) || price < 0){ errEl.textContent = 'Prix invalide.'; return; }
    if(isNaN(qty) || qty < 0){ errEl.textContent = 'Quantité invalide.'; return; }
    if(year !== null && (isNaN(year) || year < 1800 || year > 2100)){ errEl.textContent = 'Millésime invalide.'; return; }

    if(editingId){
      var b = items.find(function(x){ return x.id === editingId; });
      if(b){ b.name=name; b.year=year; b.price=price; b.qty=qty; }
    }else{
      items.push({id:uid(), name:name, year:year, price:price, qty:qty});
    }
    save(); render(); closeSheet();
  });

  qEl.addEventListener('input',render);
  qEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ qEl.blur(); } });

  /* ---------- Icône d'écran d'accueil générée à la volée ---------- */
  function makeIcon(){
    try{
      var c = document.createElement('canvas'); c.width = c.height = 180;
      var x = c.getContext('2d');
      var g = x.createLinearGradient(0,0,180,180);
      g.addColorStop(0,'#c0395a'); g.addColorStop(1,'#5a1228');
      x.fillStyle = g; x.fillRect(0,0,180,180);
      x.font = '100px serif'; x.textAlign='center'; x.textBaseline='middle';
      x.fillText('🍷',90,98);
      $('touchIcon').href = c.toDataURL('image/png');
    }catch(e){}
  }

  /* ---------- Démarrage ---------- */
  load(); render(); makeIcon();
})();
</script>
</body>
</html>
