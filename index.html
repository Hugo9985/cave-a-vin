<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ma Cave à Vin</title>

<!-- Android / MagicOS : Web App Manifest (Data URI) -->
<link rel="manifest" id="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Ma%20Cave%20%C3%A0%20Vin%22%2C%22short_name%22%3A%22Ma%20Cave%22%2C%22description%22%3A%22Gestion%20de%20cave%20%C3%A0%20vin%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22theme_color%22%3A%22%23121212%22%2C%22background_color%22%3A%22%23121212%22%2C%22start_url%22%3A%22.%22%7D">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Ma Cave">

<!-- iOS : mode Web App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Cave">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" id="favicon" href="">

<style>
  :root{
    --bg:#121212;
    --surface:#1c1c22;
    --surface2:#26262e;
    --line:#32323d;
    --text:#f4f4f7;
    --muted:#9a9aa8;
    --wine:#c0395a;
    --wine2:#8e2142;
    --danger:#ff5a50;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;background:var(--bg);color:var(--text);color-scheme:dark;
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);
    padding-bottom:calc(110px + var(--safe-bottom));
    -webkit-user-select:none;user-select:none}
  input,select{-webkit-user-select:text;user-select:text}
  button,select,input{font-family:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  header{padding:18px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
  h1 span{color:var(--wine)}
  .install{display:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--wine);
    background:transparent;color:var(--wine);font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .install.show{display:block}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .stat{background:linear-gradient(145deg,var(--surface),var(--surface2));
    border:1px solid var(--line);border-radius:20px;padding:16px}
  .stat small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
  .stat b{display:block;font-size:26px;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat.accent b{color:var(--wine)}

  .tools{position:sticky;top:var(--safe-top);z-index:5;padding:8px 0 10px;
    background:linear-gradient(var(--bg) 85%,transparent)}
  .search{position:relative}
  .search input{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:17px;padding:0 16px 0 46px;outline:none;
    -webkit-appearance:none;appearance:none}
  .search input:focus{border-color:var(--wine)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}

  .sort{display:flex;gap:8px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px}
  .sort::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-width:86px;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;
    touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .chip:active{transform:scale(.96)}
  .chip.on{background:linear-gradient(135deg,var(--wine),var(--wine2));border-color:transparent;color:#fff}
  .chip .arr{font-size:16px}

  .list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;
    display:flex;gap:14px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .photo{flex:0 0 84px;width:84px;height:112px;border-radius:16px;overflow:hidden;
    background:linear-gradient(160deg,var(--surface2),#17171d);border:1px solid var(--line);
    display:grid;place-items:center;font-size:34px}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .body{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .name{font-size:18px;font-weight:700;line-height:1.25;word-break:break-word}
  .meta{color:var(--muted);font-size:14px;margin-top:3px}
  .floor{display:inline-block;margin-top:7px;padding:4px 11px;border-radius:999px;
    background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text)}
  .floor i{font-style:normal;color:var(--wine)}
  .menu{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{width:44px;height:44px;border-radius:13px;border:none;background:var(--surface2);
    color:var(--text);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
  .icon-btn:active{transform:scale(.92);background:var(--line)}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.del{color:var(--danger)}

  .qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px;flex-wrap:wrap}
  .qty .sub{color:var(--muted);font-size:13px}
  .qty .sub b{display:block;color:var(--text);font-size:15px}
  .stepper{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:18px;padding:4px}
  .step{width:52px;height:50px;border-radius:14px;border:none;font-size:28px;font-weight:600;
    color:var(--text);background:var(--line);cursor:pointer;line-height:1;touch-action:manipulation}
  .step.plus{background:var(--wine)}
  .step:active{transform:scale(.9)}
  .step:disabled{opacity:.35}
  .count{min-width:40px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .count.zero{color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.5}
  .empty .big{font-size:52px;margin-bottom:8px}

  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));height:60px;padding:0 24px;
    border:none;border-radius:30px;background:linear-gradient(135deg,var(--wine),var(--wine2));
    color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;
    box-shadow:0 10px 30px rgba(192,57,90,.45);cursor:pointer;z-index:10;touch-action:manipulation}
  .fab:active{transform:scale(.95)}
  .fab svg{width:22px;height:22px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
    align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:560px;max-height:100dvh;overflow-y:auto;background:var(--surface);
    border-radius:28px 28px 0 0;padding:22px 18px calc(22px + var(--safe-bottom));
    border:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px}}
  .sheet h2{margin:0 0 6px;font-size:22px}
  label{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
  .sheet input[type=text],.sheet input[type=number],.sheet select{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface2);color:var(--text);font-size:17px;padding:0 14px;outline:none;
    -webkit-appearance:none;appearance:none}
  .sheet select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;padding-right:40px}
  .sheet input:focus,.sheet select:focus{border-color:var(--wine)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .photo-edit{display:flex;gap:14px;align-items:center;margin-top:8px}
  .photo-edit .photo{flex:0 0 96px;width:96px;height:128px}
  .photo-btns{flex:1;display:flex;flex-direction:column;gap:8px}
  .pbtn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
    font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .pbtn:active{transform:scale(.96)}
  .pbtn.rm{color:var(--danger);height:44px;font-size:14px}
  .pbtn[hidden]{display:none}
  .hidden-input{display:none}

  .actions{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:22px}
  .btn{height:58px;border-radius:16px;border:none;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .btn:active{transform:scale(.96)}
  .btn.cancel{background:var(--surface2);color:var(--text)}
  .btn.save{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff}
  .btn:disabled{opacity:.5}
  .err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>🍷 Ma <span>Cave</span></h1>
    <button class="install" id="installBtn" type="button">Installer</button>
  </header>

  <section class="stats">
    <div class="stat"><small>Bouteilles</small><b id="totalBottles">0</b></div>
    <div class="stat accent"><small>Valeur totale</small><b id="totalValue">0 €</b></div>
  </section>

  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un vin…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="sort" id="sort">
      <button type="button" class="chip" data-sort="floor">Étage <span class="arr"></span></button>
      <button type="button" class="chip" data-sort="name">Nom <span class="arr"></span></button>
      <button type="button" class="chip" data-sort="price">Prix <span class="arr"></span></button>
      <button type="button" class="chip" data-sort="year">Année <span class="arr"></span></button>
      <button type="button" class="chip" data-sort="qty">Quantité <span class="arr"></span></button>
    </div>
  </div>

  <main class="list" id="list"></main>
</div>

<button class="fab" id="addBtn" type="button" aria-label="Ajouter une bouteille">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter
</button>

<div class="overlay" id="overlay">
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="sheetTitle">Nouvelle bouteille</h2>

    <label>Photo de la bouteille</label>
    <div class="photo-edit">
      <div class="photo" id="photoPreview">🍷</div>
      <div class="photo-btns">
        <button type="button" class="pbtn" id="camBtn">📷 Prendre une photo</button>
        <button type="button" class="pbtn" id="galBtn">🖼️ Choisir dans la galerie</button>
        <button type="button" class="pbtn rm" id="rmBtn" hidden>Retirer la photo</button>
      </div>
    </div>
    <input class="hidden-input" id="camInput" type="file" accept="image/*" capture="environment">
    <input class="hidden-input" id="galInput" type="file" accept="image/*">

    <label for="fName">Nom du vin</label>
    <input id="fName" type="text" placeholder="Ex. Château Margaux" autocapitalize="words" enterkeyhint="next">
    <div class="row">
      <div><label for="fYear">Millésime</label>
        <input id="fYear" type="number" inputmode="numeric" placeholder="2015" min="1800" max="2100"></div>
      <div><label for="fPrice">Prix (€)</label>
        <input id="fPrice" type="number" inputmode="decimal" placeholder="25" min="0" step="0.01"></div>
    </div>
    <div class="row">
      <div><label for="fQty">Quantité restante</label>
        <input id="fQty" type="number" inputmode="numeric" placeholder="6" min="0" step="1"></div>
      <div><label for="fFloor">Étage (1 à 10)</label>
        <select id="fFloor"></select></div>
    </div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="btn cancel" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn save" id="saveBtn">Enregistrer</button>
    </div>
  </form>
</div>

<script>
(function(){
  'use strict';
  var KEY = 'maCaveAVin.v1';
  var SORT_KEY = 'maCaveAVin.sort';
  var items = [];
  var editingId = null;
  var currentPhoto = '';   /* image compressée (data URL JPEG) du formulaire en cours */
  var sortState = {key:'name', dir:'asc'};
  /* Sens par défaut au premier appui sur chaque critère */
  var DEFAULT_DIR = {floor:'asc', name:'asc', price:'asc', year:'asc', qty:'desc'};

  var $ = function(id){ return document.getElementById(id); };
  var listEl=$('list'), qEl=$('q'), overlay=$('overlay'), form=$('form'), errEl=$('err');
  var fName=$('fName'), fYear=$('fYear'), fPrice=$('fPrice'), fQty=$('fQty'), fFloor=$('fFloor');

  /* Sélecteur d'étage : 1 à 10 */
  for(var i=1;i<=10;i++){
    var o = document.createElement('option'); o.value = i; o.textContent = 'Étage ' + i;
    fFloor.appendChild(o);
  }

  /* ---------- Stockage local ---------- */
  function clampFloor(n){ n = parseInt(n,10); return (isNaN(n) || n<1) ? 1 : (n>10 ? 10 : n); }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(items)) items = [];
      items.forEach(function(b){ b.floor = clampFloor(b.floor); b.photo = b.photo || ''; });
    }catch(e){ items = []; }
    try{
      var s = JSON.parse(localStorage.getItem(SORT_KEY) || 'null');
      if(s && DEFAULT_DIR[s.key] && (s.dir==='asc'||s.dir==='desc')) sortState = s;
    }catch(e){}
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch(e){ return false; }
  }
  function saveSort(){
    try{ localStorage.setItem(SORT_KEY, JSON.stringify(sortState)); }catch(e){}
  }

  /* ---------- Utilitaires ---------- */
  var eur = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){} }
  function byName(a,b){ return a.name.localeCompare(b.name,'fr'); }

  /* ---------- Tri ---------- */
  function sorter(){
    var k = sortState.key, m = sortState.dir === 'asc' ? 1 : -1;
    return function(a,b){
      var r;
      if(k === 'floor') r = (a.floor - b.floor);
      else if(k === 'price') r = (a.price - b.price);
      else if(k === 'qty') r = (a.qty - b.qty);
      else if(k === 'year'){
        /* les bouteilles sans millésime passent toujours en dernier */
        if(!a.year && !b.year) return byName(a,b);
        if(!a.year) return 1;
        if(!b.year) return -1;
        r = (a.year - b.year);
      }
      else return byName(a,b) * m;
      return (r * m) || byName(a,b);
    };
  }
  function updateSortUI(){
    var chips = document.querySelectorAll('#sort .chip');
    for(var i=0;i<chips.length;i++){
      var c = chips[i], on = c.getAttribute('data-sort') === sortState.key;
      c.classList.toggle('on', on);
      c.querySelector('.arr').textContent = on ? (sortState.dir === 'asc' ? '↑' : '↓') : '';
    }
  }
  $('sort').addEventListener('click',function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    var k = c.getAttribute('data-sort');
    if(sortState.key === k) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    else sortState = {key:k, dir:DEFAULT_DIR[k]};
    haptic(); saveSort(); render();
  });

  /* ---------- Rendu ---------- */
  function render(){
    var term = qEl.value.trim().toLowerCase();
    var shown = items.filter(function(b){ return b.name.toLowerCase().indexOf(term) !== -1; }).sort(sorter());

    var totalB = 0, totalV = 0;
    items.forEach(function(b){ totalB += b.qty; totalV += b.qty * b.price; });
    $('totalBottles').textContent = totalB;
    $('totalValue').textContent = eur.format(totalV);
    updateSortUI();

    if(!shown.length){
      listEl.innerHTML = '<div class="empty"><div class="big">🍾</div>' +
        (items.length ? 'Aucune bouteille ne correspond à votre recherche.'
                      : 'Votre cave est vide.<br>Touchez « Ajouter » pour commencer.') + '</div>';
      return;
    }

    listEl.innerHTML = shown.map(function(b){
      var year = b.year ? b.year : 'Sans millésime';
      var photo = b.photo ? '<img src="'+b.photo+'" alt="" loading="lazy">' : '🍷';
      return '<article class="card" data-id="'+b.id+'">' +
        '<div class="photo">'+photo+'</div>' +
        '<div class="body">' +
          '<div class="top"><div style="min-width:0">' +
            '<div class="name">'+esc(b.name)+'</div>' +
            '<div class="meta">'+esc(year)+' · '+eur.format(b.price)+'</div>' +
            '<span class="floor">Étage <i>'+b.floor+'</i></span>' +
          '</div><div class="menu">' +
            '<button class="icon-btn" data-act="edit" aria-label="Modifier"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>' +
            '<button class="icon-btn del" data-act="del" aria-label="Supprimer"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>' +
          '</div></div>' +
          '<div class="qty"><div class="sub">Valeur<b>'+eur.format(b.qty*b.price)+'</b></div>' +
            '<div class="stepper">' +
              '<button class="step" data-act="minus" aria-label="Retirer une bouteille"'+(b.qty<=0?' disabled':'')+'>−</button>' +
              '<div class="count'+(b.qty<=0?' zero':'')+'">'+b.qty+'</div>' +
              '<button class="step plus" data-act="plus" aria-label="Ajouter une bouteille">+</button>' +
            '</div></div>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  /* ---------- Actions sur la liste ---------- */
  listEl.addEventListener('click',function(e){
    var btn = e.target.closest('button[data-act]');
    if(!btn) return;
    var card = btn.closest('.card');
    var id = card.getAttribute('data-id');
    var b = items.find(function(x){ return x.id === id; });
    if(!b) return;
    var act = btn.getAttribute('data-act');

    if(act === 'plus'){ b.qty++; haptic(); save(); render(); }
    else if(act === 'minus'){ if(b.qty>0){ b.qty--; haptic(); save(); render(); } }
    else if(act === 'edit'){ openSheet(b); }
    else if(act === 'del'){
      if(confirm('Supprimer « '+b.name+' » de la cave ?')){
        items = items.filter(function(x){ return x.id !== id; });
        save(); render();
      }
    }
  });

  /* ---------- Photo : import + compression ---------- */
  var MAX_SIDE = 360, QUALITY = 0.6;   /* ≈ 15–30 Ko par photo */

  function compressImage(file){
    return new Promise(function(resolve,reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth, h = img.naturalHeight;
          var s = Math.min(1, MAX_SIDE / Math.max(w,h));
          var cw = Math.max(1,Math.round(w*s)), ch = Math.max(1,Math.round(h*s));
          var c = document.createElement('canvas'); c.width = cw; c.height = ch;
          var x = c.getContext('2d');
          x.fillStyle = '#fff'; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg',QUALITY));
        }catch(err){ URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }
  function showPhotoPreview(){
    var p = $('photoPreview');
    if(currentPhoto){ p.innerHTML = '<img src="'+currentPhoto+'" alt="">'; $('rmBtn').hidden = false; }
    else{ p.textContent = '🍷'; $('rmBtn').hidden = true; }
  }
  function onPick(input){
    input.addEventListener('change',function(){
      var f = input.files && input.files[0];
      input.value = '';
      if(!f) return;
      errEl.textContent = '';
      compressImage(f).then(function(d){ currentPhoto = d; showPhotoPreview(); })
        .catch(function(){ errEl.textContent = 'Impossible de lire cette image.'; });
    });
  }
  onPick($('camInput')); onPick($('galInput'));
  $('camBtn').addEventListener('click',function(){ $('camInput').click(); });
  $('galBtn').addEventListener('click',function(){ $('galInput').click(); });
  $('rmBtn').addEventListener('click',function(){ currentPhoto = ''; showPhotoPreview(); });

  /* ---------- Feuille d'ajout / édition ---------- */
  function openSheet(b){
    editingId = b ? b.id : null;
    $('sheetTitle').textContent = b ? 'Modifier la bouteille' : 'Nouvelle bouteille';
    fName.value  = b ? b.name : '';
    fYear.value  = b && b.year ? b.year : '';
    fPrice.value = b ? b.price : '';
    fQty.value   = b ? b.qty : '1';
    fFloor.value = b ? b.floor : '1';
    currentPhoto = b ? (b.photo || '') : '';
    showPhotoPreview();
    errEl.textContent = '';
    overlay.classList.add('open');
  }
  function closeSheet(){
    overlay.classList.remove('open');
    if(document.activeElement) document.activeElement.blur();
  }

  $('addBtn').addEventListener('click',function(){ openSheet(null); });
  $('cancelBtn').addEventListener('click',closeSheet);
  overlay.addEventListener('click',function(e){ if(e.target === overlay) closeSheet(); });

  /* Bouton retour Android : ferme la feuille au lieu de quitter l'app */
  window.addEventListener('popstate',function(){ if(overlay.classList.contains('open')) overlay.classList.remove('open'); });
  new MutationObserver(function(){
    if(overlay.classList.contains('open')){ try{ history.pushState({sheet:1},''); }catch(e){} }
  }).observe(overlay,{attributes:true,attributeFilter:['class']});

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name = fName.value.trim();
    var year = fYear.value.trim() === '' ? null : parseInt(fYear.value,10);
    var price = fPrice.value.trim() === '' ? 0 : parseFloat(String(fPrice.value).replace(',','.'));
    var qty = fQty.value.trim() === '' ? 0 : parseInt(fQty.value,10);
    var floor = parseInt(fFloor.value,10);

    if(!name){ errEl.textContent = 'Le nom du vin est obligatoire.'; return; }
    if(isNaN(price) || price < 0){ errEl.textContent = 'Prix invalide.'; return; }
    if(isNaN(qty) || qty < 0){ errEl.textContent = 'Quantité invalide.'; return; }
    if(year !== null && (isNaN(year) || year < 1800 || year > 2100)){ errEl.textContent = 'Millésime invalide.'; return; }
    if(isNaN(floor) || floor < 1 || floor > 10){ errEl.textContent = 'L’étage doit être compris entre 1 et 10.'; return; }

    var snapshot = JSON.stringify(items);
    if(editingId){
      var b = items.find(function(x){ return x.id === editingId; });
      if(b){ b.name=name; b.year=year; b.price=price; b.qty=qty; b.floor=floor; b.photo=currentPhoto; }
    }else{
      items.push({id:uid(), name:name, year:year, price:price, qty:qty, floor:floor, photo:currentPhoto});
    }
    if(!save()){
      items = JSON.parse(snapshot);
      errEl.textContent = 'Espace de stockage plein : retirez des photos ou supprimez des bouteilles.';
      return;
    }
    render(); closeSheet();
  });

  qEl.addEventListener('input',render);
  qEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ qEl.blur(); } });

  /* ---------- Icônes + manifeste complété à l'exécution ---------- */
  function drawIcon(size){
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#c0395a'); g.addColorStop(1,'#5a1228');
    x.fillStyle = g; x.fillRect(0,0,size,size);
    x.font = Math.round(size*0.55)+'px serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('🍷',size/2,size*0.54);
    return c.toDataURL('image/png');
  }
  function setupIconsAndManifest(){
    try{
      var i180 = drawIcon(180), i192 = drawIcon(192), i512 = drawIcon(512);
      $('touchIcon').href = i180;
      $('favicon').href = i192;
      /* Le manifeste Data URI de départ n'a pas d'URL de base : on le recrée
         avec l'adresse réelle de la page et des icônes PNG pour l'installation. */
      var base = location.href.split('#')[0];
      var m = {
        name:'Ma Cave à Vin', short_name:'Ma Cave', description:'Gestion de cave à vin',
        display:'standalone', orientation:'portrait',
        theme_color:'#121212', background_color:'#121212',
        start_url: base, scope: base.replace(/[^\/]*$/,''),
        icons:[
          {src:i192, sizes:'192x192', type:'image/png', purpose:'any'},
          {src:i512, sizes:'512x512', type:'image/png', purpose:'any'}
        ]
      };
      if(/^https?:/.test(base)){
        $('manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
      }
    }catch(e){}
  }

  /* ---------- Bouton « Installer » (Android / Chrome) ---------- */
  var deferred = null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred = e; $('installBtn').classList.add('show');
  });
  $('installBtn').addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; $('installBtn').classList.remove('show'); });
  });
  window.addEventListener('appinstalled',function(){ $('installBtn').classList.remove('show'); });

  /* ---------- Démarrage ---------- */
  load(); render(); setupIconsAndManifest();
})();
</script>
</body>
</html>
